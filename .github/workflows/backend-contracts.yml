name: Validate backend contracts

"on":
  pull_request:
    paths:
      - ".github/workflows/backend-contracts.yml"
      - "infrastructure/**"
      - "supabase/**"
      - "netlify.toml"
  push:
    branches-ignore:
      - main
    paths:
      - ".github/workflows/backend-contracts.yml"
      - "infrastructure/**"
      - "supabase/**"
      - "netlify.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install adapter test dependencies
        run: Rscript -e 'install.packages(c("digest", "jsonlite"), repos = "https://packagemanager.posit.co/cran/latest")'

      - name: Parse R job sources and run offline adapter contract
        shell: bash
        run: |
          Rscript -e 'files <- list.files("infrastructure/cloud-run", pattern = "[.]R$", recursive = TRUE, full.names = TRUE); invisible(lapply(files, parse))'
          Rscript infrastructure/cloud-run/tests/run-tests.R

      - name: Run offline release-store contract
        run: Rscript infrastructure/storage/tests/run-tests.R

      - name: Verify source-permission guard is present
        shell: bash
        run: |
          grep -q "commercial_serving_allowed" supabase/migrations/*.sql
          grep -q "publish_release" supabase/migrations/*.sql
          grep -A8 "'fangraphs'" supabase/migrations/*.sql | grep -q "'pending_review'"
          grep -A8 "'mlb'" supabase/migrations/*.sql | grep -q "'pending_review'"

      - name: Confirm cloud resources remain opt-in
        shell: bash
        run: |
          grep -A3 'variable "enable_cloud_resources"' infrastructure/terraform/variables.tf | grep -q "default     = false"
          grep -A3 'variable "enable_scheduler"' infrastructure/terraform/variables.tf | grep -q "default     = false"
          grep -A3 'variable "publish_release"' infrastructure/terraform/variables.tf | grep -q "default     = false"

  supabase-shadow-restore:
    name: Supabase shadow round trip
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/backend-overhaul' &&
      contains(github.event.head_commit.message, '[supabase-shadow]'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SABRHOOD_SOURCE_RELEASE_KEY: shadow-20260724-002
      SABRHOOD_OUTPUT_RELEASE_KEY: shadow-gh-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository without write credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Confirm required secrets are available
        shell: bash
        env:
          SABRHOOD_SUPABASE_URL: ${{ secrets.SABRHOOD_SUPABASE_URL }}
          SABRHOOD_SUPABASE_SECRET_KEY: ${{ secrets.SABRHOOD_SUPABASE_SECRET_KEY }}
          SABRHOOD_SUPABASE_BUCKET: ${{ secrets.SABRHOOD_SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          for variable in \
            SABRHOOD_SUPABASE_URL \
            SABRHOOD_SUPABASE_SECRET_KEY \
            SABRHOOD_SUPABASE_BUCKET
          do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not configured for this repository."
              exit 1
            fi
          done

      - name: Install restore dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::digest
            any::httr
            any::jsonlite
          cache: false
          install-pandoc: false
          install-quarto: false

      - name: Restore and checksum private pipeline state
        shell: bash
        env:
          SABRHOOD_SUPABASE_URL: ${{ secrets.SABRHOOD_SUPABASE_URL }}
          SABRHOOD_SUPABASE_SECRET_KEY: ${{ secrets.SABRHOOD_SUPABASE_SECRET_KEY }}
          SABRHOOD_SUPABASE_BUCKET: ${{ secrets.SABRHOOD_SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          Rscript scripts/supabase_storage.R restore \
            "--release-key=${SABRHOOD_SOURCE_RELEASE_KEY}" \
            "--target=.private-data" \
            "--components=private_state"

      - name: Stage a new immutable release
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/backend_release.R stage \
            "--release-key=${SABRHOOD_OUTPUT_RELEASE_KEY}"
          Rscript scripts/supabase_storage.R plan \
            "--release-key=${SABRHOOD_OUTPUT_RELEASE_KEY}"

      - name: Upload and verify without promotion
        shell: bash
        env:
          SABRHOOD_SUPABASE_URL: ${{ secrets.SABRHOOD_SUPABASE_URL }}
          SABRHOOD_SUPABASE_SECRET_KEY: ${{ secrets.SABRHOOD_SUPABASE_SECRET_KEY }}
          SABRHOOD_SUPABASE_BUCKET: ${{ secrets.SABRHOOD_SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          Rscript scripts/supabase_storage.R upload \
            "--release-key=${SABRHOOD_OUTPUT_RELEASE_KEY}"
          Rscript scripts/supabase_storage.R verify \
            "--release-key=${SABRHOOD_OUTPUT_RELEASE_KEY}"

      - name: Confirm the round trip stayed isolated
        shell: bash
        run: |
          set -euo pipefail
          test -d ".private-data"
          test -f \
            ".backend/release-store/releases/${SABRHOOD_OUTPUT_RELEASE_KEY}/manifest.json"

          file_count=$(find ".private-data" -type f | wc -l)
          byte_count=$(du -sb ".private-data" | cut -f1)
          test "$file_count" -gt 0
          test "$byte_count" -gt 0

          echo "Verified unpromoted release: ${SABRHOOD_OUTPUT_RELEASE_KEY}"
          echo "Recovered private state: ${file_count} files, ${byte_count} bytes."
          test -z "$(git status --porcelain)"

  supabase-storage-inventory:
    name: Supabase storage inventory
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/backend-overhaul' &&
      contains(github.event.head_commit.message, '[supabase-inventory]')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository without write credentials
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Confirm required secrets are available
        shell: bash
        env:
          SABRHOOD_SUPABASE_URL: ${{ secrets.SABRHOOD_SUPABASE_URL }}
          SABRHOOD_SUPABASE_SECRET_KEY: ${{ secrets.SABRHOOD_SUPABASE_SECRET_KEY }}
          SABRHOOD_SUPABASE_BUCKET: ${{ secrets.SABRHOOD_SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          for variable in \
            SABRHOOD_SUPABASE_URL \
            SABRHOOD_SUPABASE_SECRET_KEY \
            SABRHOOD_SUPABASE_BUCKET
          do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not configured for this repository."
              exit 1
            fi
          done

      - name: Install inventory dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::digest
            any::httr
            any::jsonlite
          cache: false
          install-pandoc: false
          install-quarto: false

      - name: Inventory staged releases
        shell: bash
        env:
          SABRHOOD_SUPABASE_URL: ${{ secrets.SABRHOOD_SUPABASE_URL }}
          SABRHOOD_SUPABASE_SECRET_KEY: ${{ secrets.SABRHOOD_SUPABASE_SECRET_KEY }}
          SABRHOOD_SUPABASE_BUCKET: ${{ secrets.SABRHOOD_SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          Rscript scripts/supabase_storage.R inventory | tee inventory.txt
          summary_line=$(tail -n 1 inventory.txt)
          echo "::notice title=Supabase storage inventory::$summary_line"
          {
            echo "## Supabase storage inventory"
            echo
            echo '```text'
            cat inventory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
