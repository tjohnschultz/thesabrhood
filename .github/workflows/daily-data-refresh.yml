name: Daily MLB data refresh

"on":
  schedule:
    - cron: "0 6 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      pbp_end:
        description: "Last completed PBP date (YYYY-MM-DD); defaults to yesterday"
        required: false
        type: string
      slate_date:
        description: "Game-information date (YYYY-MM-DD); defaults to today"
        required: false
        type: string
      publish_supabase_shadow:
        description: "Stage and verify an unpromoted Supabase release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: sabrhood-daily-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SABRHOOD_PBP_END: ${{ inputs.pbp_end }}
      SABRHOOD_DATE: ${{ inputs.slate_date }}
      SABRHOOD_N_SIMS: "20000"
      SABRHOOD_PLAYER_N_SIMS: "2000"
      SABRHOOD_STATE_N_SIMS: "250"
      SABRHOOD_SHADOW_RELEASE_KEY: daily-shadow-${{ github.run_id }}-${{ github.run_attempt }}
      SABRHOOD_PUBLISH_SHADOW: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_supabase_shadow == true) || (github.event_name == 'schedule' && vars.SABRHOOD_SCHEDULED_SHADOW_ENABLED == 'true') }}
      SABRHOOD_RECOVERY_RELEASE_KEY: ${{ vars.SABRHOOD_RECOVERY_RELEASE_KEY || 'shadow-20260724-002' }}
      SABRHOOD_RETENTION_KEEP: "3"

    steps:
      - name: Check out site repository
        uses: actions/checkout@v5

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Restore private pipeline cache
        uses: actions/cache/restore@v5
        with:
          path: .private-data
          key: sabrhood-private-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            sabrhood-private-${{ runner.os }}-
            sabrhood-pbp-${{ runner.os }}-

      - name: Install R dependencies and SABRhood package
        shell: bash
        run: |
          Rscript -e 'install.packages(c("remotes", "digest", "httr", "jsonlite", "dplyr", "rlang", "tibble", "withr", "ggplot2", "knitr", "rmarkdown", "Lahman"), repos = "https://cloud.r-project.org")'
          Rscript -e 'remotes::install_url("https://github.com/BillPetti/baseballr/archive/refs/tags/v1.6.0.tar.gz", dependencies = NA, upgrade = "never")'
          Rscript -e 'stopifnot(requireNamespace("baseballr", quietly = TRUE)); message("Installed baseballr ", packageVersion("baseballr"))'
          R CMD INSTALL packages/sabrhoodR

      - name: Update completed-game PBP
        shell: bash
        run: |
          if [ -z "$SABRHOOD_PBP_END" ]; then unset SABRHOOD_PBP_END; fi
          Rscript scripts/update_pbp.R

      - name: Settle prior projection snapshots
        run: Rscript scripts/settle_projection_ledger.R

      - name: Rebuild all PBP-derived analytics
        run: Rscript scripts/build_pbp_products.R

      - name: Rebuild Phase 4, run game, and fielding inputs
        shell: bash
        run: |
          Rscript scripts/fetch_historical_game_venues.R
          Rscript scripts/build_phase4_baserunning_products.R
          Rscript scripts/build_run_game_products.R
          Rscript scripts/build_fielding_products.R

      - name: Rebuild history, milestone, and editorial engines
        shell: bash
        run: |
          if [ -z "$SABRHOOD_DATE" ]; then unset SABRHOOD_DATE; fi
          Rscript scripts/build_history_products.R
          Rscript scripts/build_daily_retrosheet_history.R
          Rscript scripts/build_editorial_products.R

      - name: Refresh MLB and Triple-A standings movement
        continue-on-error: true
        run: Rscript scripts/refresh_standings.R

      - name: Refresh Triple-A watch
        continue-on-error: true
        run: Rscript scripts/refresh_aaa.R

      - name: Pull today's games, starters, orders, rosters, and weather
        id: slate
        shell: bash
        run: |
          if [ -z "$SABRHOOD_DATE" ]; then unset SABRHOOD_DATE; fi
          Rscript scripts/pull_daily_game_info.R
          if [ -f .private-data/no-slate ]; then
            echo "has_slate=false" >> "$GITHUB_OUTPUT"
            echo "has_lineups=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_slate=true" >> "$GITHUB_OUTPUT"
            lineup_rows=$(Rscript -e 'x <- read.csv("data/derived/daily-batting-orders.csv", check.names = FALSE); cat(nrow(x))')
            if [ "$lineup_rows" -ge 9 ]; then
              echo "has_lineups=true" >> "$GITHUB_OUTPUT"
            else
              echo "has_lineups=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build yesterday and current-series context
        run: Rscript scripts/build_daily_series_context.R

      - name: Build daily team projections
        if: steps.slate.outputs.has_slate == 'true'
        run: Rscript scripts/build_daily_team_simulations.R

      - name: Build Phase 5 game-state and player projections
        if: steps.slate.outputs.has_lineups == 'true'
        shell: bash
        run: |
          Rscript scripts/build_daily_matchup_probabilities.R
          Rscript scripts/build_daily_state_simulations.R
          Rscript scripts/build_daily_player_probabilities.R
          Rscript scripts/build_daily_player_simulations.R

      - name: Archive eligible pregame predictions
        if: steps.slate.outputs.has_slate == 'true'
        run: Rscript scripts/archive_projection_snapshot.R

      - name: Build daily newsletter edition
        run: Rscript scripts/build_daily_newsletter.R

      - name: Rebuild branded graphics feed
        run: Rscript scripts/build_graphics_feed.R

      - name: Enforce public-product freshness
        run: Rscript scripts/build_refresh_health.R

      - name: Update derived-data manifest
        run: Rscript scripts/update_derived_manifest.R

      - name: Generate and validate site source
        shell: bash
        run: |
          Rscript scripts/build_site_fragments.R
          Rscript scripts/validate_site.R

      - name: Render Quarto site
        run: quarto render --no-clean

      - name: Finalize and validate rendered site
        run: Rscript scripts/finalize_rendered_site.R

      - name: Confirm Supabase shadow publication secrets
        if: env.SABRHOOD_PUBLISH_SHADOW == 'true'
        shell: bash
        env:
          SABRHOOD_SUPABASE_URL: ${{ secrets.SABRHOOD_SUPABASE_URL }}
          SABRHOOD_SUPABASE_SECRET_KEY: ${{ secrets.SABRHOOD_SUPABASE_SECRET_KEY }}
          SABRHOOD_SUPABASE_BUCKET: ${{ secrets.SABRHOOD_SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          for variable in \
            SABRHOOD_SUPABASE_URL \
            SABRHOOD_SUPABASE_SECRET_KEY \
            SABRHOOD_SUPABASE_BUCKET
          do
            if [ -z "${!variable:-}" ]; then
              echo "::error::$variable is not configured for this repository."
              exit 1
            fi
          done

      - name: Stage complete Supabase shadow release
        if: env.SABRHOOD_PUBLISH_SHADOW == 'true'
        shell: bash
        run: |
          set -euo pipefail
          Rscript scripts/backend_release.R stage \
            "--release-key=${SABRHOOD_SHADOW_RELEASE_KEY}"
          Rscript scripts/supabase_storage.R plan \
            "--release-key=${SABRHOOD_SHADOW_RELEASE_KEY}"

      - name: Upload and verify Supabase shadow release
        if: env.SABRHOOD_PUBLISH_SHADOW == 'true'
        shell: bash
        env:
          SABRHOOD_SUPABASE_URL: ${{ secrets.SABRHOOD_SUPABASE_URL }}
          SABRHOOD_SUPABASE_SECRET_KEY: ${{ secrets.SABRHOOD_SUPABASE_SECRET_KEY }}
          SABRHOOD_SUPABASE_BUCKET: ${{ secrets.SABRHOOD_SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          Rscript scripts/supabase_storage.R upload \
            "--release-key=${SABRHOOD_SHADOW_RELEASE_KEY}"
          Rscript scripts/supabase_storage.R verify \
            "--release-key=${SABRHOOD_SHADOW_RELEASE_KEY}"
          echo "Supabase shadow release verified; current.json was not changed."

      - name: Report Supabase shadow retention plan
        if: env.SABRHOOD_PUBLISH_SHADOW == 'true'
        shell: bash
        env:
          SABRHOOD_SUPABASE_URL: ${{ secrets.SABRHOOD_SUPABASE_URL }}
          SABRHOOD_SUPABASE_SECRET_KEY: ${{ secrets.SABRHOOD_SUPABASE_SECRET_KEY }}
          SABRHOOD_SUPABASE_BUCKET: ${{ secrets.SABRHOOD_SUPABASE_BUCKET }}
        run: |
          set -euo pipefail
          Rscript scripts/supabase_storage.R inventory | tee inventory.txt
          Rscript scripts/supabase_storage.R retention-plan \
            "--keep=${SABRHOOD_RETENTION_KEEP}" \
            "--protect=${SABRHOOD_RECOVERY_RELEASE_KEY}" | tee retention-plan.txt
          {
            echo "## Supabase shadow publication"
            echo
            echo "- Verified release: \`${SABRHOOD_SHADOW_RELEASE_KEY}\`"
            echo "- Protected recovery release: \`${SABRHOOD_RECOVERY_RELEASE_KEY}\`"
            echo "- Newest complete releases retained: ${SABRHOOD_RETENTION_KEEP}"
            echo "- Deletion performed: no"
            echo
            echo "### Retention dry run"
            echo
            echo '```text'
            cat retention-plan.txt
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Save private pipeline cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .private-data
          key: sabrhood-private-${{ runner.os }}-${{ github.run_id }}

      - name: Commit approved derived products and rendered pages
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/derived images/graphics-feed includes docs
          if git diff --cached --quiet; then
            echo "No public data changes to commit."
          else
            git commit -m "data: refresh MLB products [skip ci]"
            git push
          fi
